version: '3.8'

services:
  redis:
    image: redis/redis-stack
    container_name: redis-server
    ports:
      - "6379:6379"
    restart: always
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    networks:
      - app-network

  express-app:
    image: node:latest
    container_name: express-server
    working_dir: /usr/src
    volumes:
      - ./:/usr/src
      - /usr/src/node_modules # Prevents overwriting node_modules
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=development
    command: sh -c "npm install && npm run dev"
    depends_on:
      - redis
    networks:
      - app-network

networks:
  app-network:
    driver: bridge